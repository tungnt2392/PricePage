<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Giá Vàng CHÍ THÀNH</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --frame-color: #4a4a4a;
            --gold-text: #f4c430; /* Fallback gold */
            --gold-bg: #d4af37;
            --led-red: #ff0000;
        }

        /* === ANIMATION DEFINITIONS === */
        @keyframes shineMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes diamondPulse {
            0% { 
                transform: scale(1);
                text-shadow: 0 0 10px rgba(244, 196, 48, 0.5);
            }
            50% { 
                transform: scale(1.1);
                text-shadow: 0 0 25px rgba(244, 196, 48, 1), 0 0 5px rgba(255, 255, 255, 0.8);
            }
            100% { 
                transform: scale(1);
                text-shadow: 0 0 10px rgba(244, 196, 48, 0.5);
            }
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .board-container {
            background-color: var(--bg-color);
            width: 98vw;
            height: 98vh;
            max-width: none; 
            padding: 0.5vh 0.5vw;
            border: 0.5vh solid var(--frame-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            border-radius: 8px;
            color: var(--gold-text);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header { text-align: center; flex-shrink: 0; }
        
        .sub-title { 
            font-size: 6vh; margin: 0; font-weight: bold; opacity: 0.9; line-height: 1;
        }
        
        /* === MAIN TITLE LUXURY LOOK (BOLD) === */
        .main-title {
            font-size: 15.5vh;
            margin: 0;
            font-weight: 900; /* Boldest weight */
            text-transform: uppercase; letter-spacing: 0.5vw;
            display: flex; align-items: center; justify-content: center; gap: 2vw;
            line-height: 1;
            
            /* Luxury Gradient Texture & Animation */
            background: linear-gradient(
                to right, 
                #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%
            );
            background-size: 200% auto;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineMove 4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(191, 149, 63, 0.4));
        }
        
        .jewelry-icon { 
            font-size: 11.5vh;
            -webkit-text-fill-color: var(--gold-text);
            animation: diamondPulse 2s ease-in-out infinite alternate;
        }
        
        .date-title { 
            font-size: 7vh; 
            margin: 0.5vh 0; border-bottom: 2px solid #333; padding-bottom: 0;
            display: inline-block; line-height: 1.1;
        }

        .datetime-display {
            display: flex; justify-content: center; gap: 5vw; 
            font-size: 6vh; margin-bottom: 0.5vh;
        }
        
        .led-number {
            font-family: 'Orbitron', sans-serif; color: var(--led-red); 
            font-size: 8vh; margin-left: 10px;
            text-shadow: 0 0 1vh var(--led-red); letter-spacing: 2px;
            display: inline-block; min-width: 150px; text-align: center;
        }

        .price-grid {
            display: grid; 
            grid-template-columns: 1.2fr 2fr 2fr; 
            gap: 0; row-gap: 0.2vh;
            align-items: center; flex-grow: 1; align-content: center; 
            padding: 0 1vh;
            background: rgba(255,255,255,0.03); border-radius: 8px;
        }
        
        .grid-header {
            font-size: 8vh; font-weight: bold; text-align: center; 
            padding-bottom: 0; border-bottom: 0.3vh solid var(--gold-text);
            margin-bottom: 0.2vh;
        }
        
        .gold-type-label {
            background-color: var(--gold-bg); color: #000; 
            font-weight: bold; font-size: 6.5vh; 
            text-align: center; padding: 0.2vh 0; border-radius: 6px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        
        .price-display {
            font-family: 'Orbitron', sans-serif; color: var(--led-red); 
            font-size: 9vh; text-align: center; 
            text-shadow: 0 0 1.5vh var(--led-red); letter-spacing: 0.2vw;
        }

        @media (max-width: 600px) {
            .main-title { font-size: 8vh; }
            .grid-header { font-size: 4vh; }
            .gold-type-label { font-size: 4vh; }
            .price-display { font-size: 5vh; }
        }
    </style>
</head>
<body>

    <div class="board-container">
        <header class="header">
            <p class="sub-title">DNTN VÀNG BẠC</p>
            <div class="main-title">
                <span class="jewelry-icon">💎</span>
                CHÍ THÀNH
                <span class="jewelry-icon">💎</span>
            </div>
            <p class="date-title">GIÁ VÀNG HÔM NAY</p>
            
            <div class="datetime-display">
                <div>Ngày <span class="led-number" id="current-date">-- - --</span></div>
                <div>Giờ <span class="led-number" id="current-time">----</span></div>
            </div>
        </header>

        <main class="price-grid" id="price-board">
            <div class="grid-header">LOẠI</div>
            <div class="grid-header">MUA VÀO</div>
            <div class="grid-header">BÁN RA</div>
            <div class="gold-type-label">Đang tải...</div>
            <div class="price-display">...</div>
            <div class="price-display">...</div>
        </main>
    </div>

    <script>
        // =========================================================
        // YOUR GOOGLE SHEET LINK IS INSERTED BELOW
        // =========================================================
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTi0HNhdSLsVTdBMVUB2XKZoJSGUtju4vWy0PJ3KnbKgKDdaDvKzDtkgweg__vXvFP60hmNLvAjW8A1/pub?output=csv"; 

        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-date').textContent = `${day}-${month}`;
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchGoldPrices() {
            try {
                // We add &t=timestamp to the URL to force a fresh download (bypass cache)
                const response = await fetch(GOOGLE_SHEET_URL + "&t=" + new Date().getTime());
                
                if (!response.ok) throw new Error('Network error');

                const textData = await response.text();
                
                // Logic: Split by new line -> trim spaces -> remove quotes -> filter empty/invalid lines
                const prices = textData
                    .split('\n')
                    .map(line => line.trim().replace(/"/g, '')) 
                    .filter(line => line !== '' && !isNaN(line.replace(/,/g, ''))); 

                if(prices.length > 0) updateBoard(prices);

            } catch (error) { 
                console.error("Error fetching prices:", error); 
            }
        }

        function updateBoard(prices) {
            const board = document.getElementById('price-board');
            
            board.innerHTML = `
                <div class="grid-header">LOẠI</div>
                <div class="grid-header">MUA VÀO</div>
                <div class="grid-header">BÁN RA</div>
            `;
            
            const types = ['9999', 'VÀNG TRANG SỨC', 'VÀNG 10K', 'BẠC'];
            let priceIndex = 0;
            
            types.forEach(type => {
                const buy = prices[priceIndex] || "---";
                const sell = prices[priceIndex + 1] || "---";
                
                board.innerHTML += `
                    <div class="gold-type-label">${type}</div>
                    <div class="price-display">${buy}</div>
                    <div class="price-display">${sell}</div>
                `;
                priceIndex += 2;
            });
        }
        
        fetchGoldPrices();
        setInterval(fetchGoldPrices, 30000); // Check for updates every 30 seconds
    </script>
</body>
</html>

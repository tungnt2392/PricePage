<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Giá Vàng CHÍ THÀNH</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --frame-color: #4a4a4a;
            --gold-text: #f4c430;
            --gold-bg: #d4af37;
            --led-red: #ff0000;
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .board-container {
            background-color: var(--bg-color);
            /* FILL THE SCREEN */
            width: 98vw;
            height: 96vh;
            /* Remove max-width limit */
            max-width: none; 
            
            padding: 1vh 1vw;
            border: 1vh solid var(--frame-color);
            box-shadow: 0 0 20px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.5);
            border-radius: 10px;
            color: var(--gold-text);
            box-sizing: border-box;
            
            /* Flex layout to distribute space evenly */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- Header Section --- */
        .header { 
            text-align: center; 
            flex-shrink: 0; /* Prevent header from shrinking */
        }
        
        .sub-title { 
            font-size: 3vh; /* Responsive font size */
            margin: 0; 
            font-weight: bold; 
            opacity: 0.9;
        }
        
        .main-title {
            font-size: 8vh; /* HUGE TITLE */
            margin: 1vh 0; 
            text-transform: uppercase; 
            letter-spacing: 0.5vw;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 2vw;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        
        .diamond-icon { font-size: 6vh; }
        
        .date-title { 
            font-size: 3.5vh; 
            margin: 1vh 0; 
            border-bottom: 2px solid #333;
            padding-bottom: 1vh;
            display: inline-block;
        }

        /* --- LED Section --- */
        .datetime-display {
            display: flex; 
            justify-content: center; 
            gap: 5vw; 
            font-size: 3vh; 
            margin-bottom: 2vh;
        }
        
        .led-number {
            font-family: 'Orbitron', sans-serif; 
            color: var(--led-red); 
            font-size: 4vh; /* Big clock numbers */
            margin-left: 10px;
            text-shadow: 0 0 1vh var(--led-red); 
            letter-spacing: 2px;
            display: inline-block; 
            min-width: 120px; 
            text-align: center;
        }

        /* --- Grid Section --- */
        .price-grid {
            display: grid; 
            /* Columns: Type(20%) - Buy(40%) - Sell(40%) */
            grid-template-columns: 1.2fr 2fr 2fr; 
            gap: 2vh 2vw; 
            align-items: center;
            
            /* Fill remaining height */
            flex-grow: 1;
            align-content: center; 
            padding: 2vh;
            background: rgba(255,255,255,0.03); /* Subtle background for grid */
            border-radius: 8px;
        }
        
        .grid-header {
            font-size: 4vh; /* Big Headers */
            font-weight: bold; 
            text-align: center; 
            padding-bottom: 1vh;
            border-bottom: 0.4vh solid var(--gold-text);
            margin-bottom: 1vh;
        }
        
        .gold-type-label {
            background-color: var(--gold-bg); 
            color: #000; 
            font-weight: bold; 
            font-size: 5vh; /* Huge Type Label */
            text-align: center; 
            padding: 1vh 0; 
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }
        
        .price-display {
            font-family: 'Orbitron', sans-serif; 
            color: var(--led-red); 
            font-size: 7vh; /* HUGE Price Numbers */
            text-align: center; 
            text-shadow: 0 0 1.5vh var(--led-red); 
            letter-spacing: 0.5vw;
        }

        /* --- START OVERLAY --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; cursor: pointer;
        }
        .start-btn {
            padding: 20px 40px; font-size: 3rem;
            background: var(--gold-bg); border: 2px solid white;
            color: black; font-weight: bold; border-radius: 10px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Mobile adjustments just in case */
        @media (max-width: 600px) {
            .main-title { font-size: 4vh; }
            .gold-type-label { font-size: 3vh; }
            .price-display { font-size: 4vh; }
        }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="enableFullScreen()">
        <button class="start-btn">CHẠM ĐỂ BẮT ĐẦU</button>
    </div>

    <div class="board-container">
        <header class="header">
            <p class="sub-title">DNTN VÀNG BẠC</p>
            <div class="main-title">
                <span class="diamond-icon">💎</span>
                CHÍ THÀNH
                <span class="diamond-icon">💎</span>
            </div>
            <p class="date-title">GIÁ VÀNG HÔM NAY</p>
            
            <div class="datetime-display">
                <div>Ngày <span class="led-number" id="current-date">-- - --</span></div>
                <div>Giờ <span class="led-number" id="current-time">----</span></div>
            </div>
        </header>

        <main class="price-grid" id="price-board">
            <div class="grid-header">LOẠI</div>
            <div class="grid-header">MUA VÀO</div>
            <div class="grid-header">BÁN RA</div>
            
            <div class="gold-type-label">...</div>
            <div class="price-display">---</div>
            <div class="price-display">---</div>
        </main>
    </div>

    <script>
        // 🔴 PASTE YOUR NPOINT URL HERE
        const API_URL = "https://api.npoint.io/a562599fcc70ea7f2de3"; 

        // 1. FULL SCREEN
        function enableFullScreen() {
            var elem = document.documentElement;
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
            document.getElementById('start-overlay').style.display = 'none';
        }

        // 2. CLOCK
        function updateClock() {
            const now = new Date();
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-date').textContent = `${day}-${month}`;
            document.getElementById('current-time').textContent = `${hours}${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. FETCH DATA
        async function fetchGoldPrices() {
            try {
                const response = await fetch(API_URL + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const prices = await response.json(); 
                if(Array.isArray(prices)) updateBoard(prices);
            } catch (error) { console.error("Error:", error); }
        }

        function updateBoard(prices) {
            const board = document.getElementById('price-board');
            board.innerHTML = `
                <div class="grid-header">LOẠI</div>
                <div class="grid-header">MUA VÀO</div>
                <div class="grid-header">BÁN RA</div>
            `;
            const types = ['9999', '99%', '980', '610'];
            let priceIndex = 0;
            types.forEach(type => {
                const buy = prices[priceIndex] || "---";
                const sell = prices[priceIndex + 1] || "---";
                board.innerHTML += `
                    <div class="gold-type-label">${type}</div>
                    <div class="price-display">${buy}</div>
                    <div class="price-display">${sell}</div>
                `;
                priceIndex += 2;
            });
        }
        fetchGoldPrices();
        setInterval(fetchGoldPrices, 30000);
    </script>
</body>
</html>
